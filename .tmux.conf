# Mouse mouse
set -g mouse on

# NO Mouse dragging
unbind-key -T root MouseDrag1Pane
unbind-key -T root MouseDragEnd1Pane
unbind-key -T root MouseDrag2Pane
unbind-key -T root MouseDragEnd2Pane
unbind-key -T root MouseDrag3Pane
unbind-key -T root MouseDragEnd3Pane

# Plugin management
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g default-command "$SHELL"

set -g default-terminal "tmux-256color"
set -ga terminal-features ',*:RGB'

set -g focus-events on

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind -Tcopy-mode-vi 'v' send -X begin-selection


# windows and panes
set-window-option -g allow-rename off

# put useful info in the status bar
set-option -g set-titles on
set-option -g set-titles-string '#S.#I.#P #W'

# Only "default" and colour0-15 track the terminal theme; colour16-255 are a
# fixed cube that Ghostty themes never remap.
set -g status-style fg=default,bg=default
set -g status-left-length 20
set -g status-left '#[fg=colour0,bg=colour7,bold] #S #[fg=colour7,bg=default,nobold]'

set -g window-status-format "#[fg=colour8]#I #[fg=colour8] #[default]#W#F "
set -g window-status-current-format "#[fg=colour7,bg=default]#[fg=colour0,bg=colour7] #I #[fg=colour0,bg=colour7] #[fg=colour0,bold]#W#F #[fg=colour7,bg=default,nobold]"

set-window-option -g window-status-style fg=default
set-window-option -g window-status-activity-style fg=colour3
set-window-option -g window-status-bell-style fg=colour1

set -g status-right ''

# pane border colors
set -g pane-border-style fg=colour8,bg=default
set -g pane-active-border-style fg=colour4,bg=default

# windows and panes start at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# https://github.com/christoomey/vim-tmux-navigator#restoring-clear-screen-c-l
bind C-l send-keys 'C-l'
bind C-k clear-history

# https://gist.github.com/william8th/faf23d311fc842be698a1d80737d9631
# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# https://github.com/cenkalti/dotfiles/blob/master/.tmux.conf
bind-key j command-prompt -p "join pane from: "  "join-pane -s '%%'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
